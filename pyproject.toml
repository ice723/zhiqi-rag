[project]
name = "knowlege-base311-cpu"
version = "0.2.0"
description = "CPU-only RAG knowledge base (SiliconFlow embedding/rerank/LLM)"
readme = "README.md"
authors = [
    { name = "高灿", email = "2016404032@qq.com" }
]
# 本地 venv 是 3.11，部署镜像用 python:3.11-slim
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "grandalf>=0.8",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langgraph>=1.0,<2",
    "minio>=7.2",
    "numpy>=1.26",
    "openai-agents>=0.24,<1",
    "mcp>=1.30,<2",
    "pymilvus>=2.5,<4",
    "pymongo>=4.6",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["config*", "processor*", "utils*", "web*", "tool*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
