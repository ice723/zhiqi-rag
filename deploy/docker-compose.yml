# CPU 版知识库：业务服务 + Milvus 2.5 + etcd + MinIO + MongoDB
# 使用方式（在 deploy 目录下）：
#   docker compose --env-file .env.prod up -d
# 注意：
#   * Milvus 必须是 2.5 及以上（BM25 Function 依赖 2.5 新增能力）
#   * 业务服务必须单进程，SSE 队列与任务进度保存在进程内存中
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: kb-etcd
    restart: always
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://etcd:2379
      - -listen-client-urls
      - http://0.0.0.0:2379
      - --data-dir
      - /etcd
    volumes:
      - ./volumes/etcd:/etcd
    networks:
      - kb-net

  minio:
    # 原固定 tag（RELEASE.2023-03-20T20-16-18Z）已从 Docker Hub 下架，改用 latest
    image: minio/minio:latest
    container_name: kb-minio
    restart: always
    environment:
      # 生产环境请改成强密码，并同步修改 .env.prod
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    ports:
      # 9000 需要公网访问：回答里的图片 URL 直接指向它
      - "9000:9000"
      # 9001 控制台只在本机访问，通过 SSH 隧道或反向代理进入
      - "127.0.0.1:9001:9001"
    volumes:
      - ./volumes/minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kb-net

  milvus:
    # 必须 2.5+：项目使用 BM25 Function + 中文分词器
    image: milvusdb/milvus:v2.5.6
    container_name: kb-milvus
    restart: always
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      # 只绑定本机，业务容器通过服务名访问；宿主机调试用 127.0.0.1:19530
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio
    networks:
      - kb-net

  mongodb:
    image: mongo:7.0
    container_name: kb-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./volumes/mongo:/data/db
    networks:
      - kb-net

  kb-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: kb-app:cpu
    container_name: kb-app
    restart: always
    env_file:
      - .env.prod
    environment:
      # 容器内固定使用服务名，覆盖 .env.prod 里的示例值
      MILVUS_URL: http://milvus:19530
      MINIO_ENDPOINT: minio:9000
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./volumes/output:/app/output
      - ./temp-files:/app/temp-files
      - ./logs:/app/logs
    depends_on:
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
      mongodb:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - kb-net

networks:
  kb-net:
    driver: bridge
