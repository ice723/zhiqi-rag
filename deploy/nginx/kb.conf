# 知识库反向代理示例（放到 /etc/nginx/conf.d/kb.conf）
# 前提：业务容器映射在 127.0.0.1:8000；如需 https 请自行准备证书
server {
    listen 80;
    server_name <你的域名或公网IP>;

    # 上传 PDF 可能较大，按需调整
    client_max_body_size 500m;

    # 问答是 SSE 长连接，必须关闭缓冲并放大超时
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SSE 单独再强调一次（部分版本会继承上面配置，这里显式声明更稳妥）
    location /stream/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # 可选：把 MinIO 图片也走同一个域名时启用
    # 启用后 .env.prod 中 MINIO_PUBLIC_BASE_URL 填 https://<域名>/minio
    # 并确保 MINIO_BUCKET_NAME 桶为 public-read（项目启动时会自动设置）
    # location /minio/ {
    #     proxy_pass http://127.0.0.1:9000/;
    #     proxy_set_header Host $host;
    #     proxy_buffering off;
    # }
}
